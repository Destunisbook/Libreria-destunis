<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2457c5">
  <meta name="description" content="Catálogo de libros educativos para primaria. Compra por WhatsApp.">
  <link rel="manifest" href="manifest.json">
  <title>Nombre Tienda | Librería educativa</title>
  <style>
    :root {
      --azul: #2457c5;
      --azul-oscuro: #173b88;
      --fondo: #f4f7fc;
      --texto: #202a3b;
      --blanco: #fff;
      --borde: #e0e7f2;
      --verde: #16834a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--fondo); color: var(--texto);
    }
    header {
      background: linear-gradient(135deg, var(--azul), var(--azul-oscuro));
      color: white; padding: 28px 16px 24px; text-align: center;
    }
    .brand { font-size: clamp(1.8rem, 6vw, 2.6rem); margin: 0; }
    header p { margin: 8px 0 0; opacity: .92; }
    .wrap { width: min(1100px, 100%); margin: auto; padding: 18px 14px 38px; }
    .toolbar { display: grid; gap: 12px; margin-bottom: 16px; }
    input[type="search"] {
      width: 100%; padding: 13px 15px; border: 1px solid var(--borde);
      border-radius: 12px; font: inherit; background: white;
    }
    .categories { display: flex; gap: 8px; flex-wrap: wrap; }
    .cat-btn {
      border: 1px solid var(--borde); background: white; border-radius: 999px;
      padding: 9px 13px; font: inherit; cursor: pointer; color: var(--texto);
    }
    .cat-btn.active { background: var(--azul); border-color: var(--azul); color: white; }
    .intro { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 0 12px; }
    .intro h2 { margin: 0; font-size: 1.25rem; }
    #count { color: #65718a; font-size: .9rem; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card {
      background: white; border: 1px solid var(--borde); border-radius: 16px;
      overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 3px 12px #142d5510;
    }
    .cover {
      min-height: 132px; display: grid; place-items: center; text-align: center;
      padding: 14px; color: white; font-size: 2.6rem;
      background: linear-gradient(145deg, #5e8cf2, #2449a8);
    }
    .cover span { display: block; font-size: .78rem; font-weight: 700; letter-spacing: .04em; margin-top: 4px; }
    .card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; }
    .category { color: var(--azul); font-size: .75rem; font-weight: 750; text-transform: uppercase; letter-spacing: .04em; }
    .card h3 { font-size: 1rem; line-height: 1.3; margin: 6px 0; }
    .description { color: #5c6679; font-size: .87rem; line-height: 1.45; margin: 0 0 12px; flex: 1; }
    .price { font-size: 1.15rem; font-weight: 800; margin-bottom: 10px; }
    .buy {
      display: block; text-align: center; background: var(--verde); color: white;
      text-decoration: none; border-radius: 10px; padding: 10px 8px; font-weight: 750;
    }
    .empty { display: none; padding: 30px 12px; text-align: center; color: #65718a; }
    footer { text-align: center; padding: 22px 14px; color: #667085; font-size: .88rem; }
    footer a { color: var(--azul); }
    @media (min-width: 620px) {
      .wrap { padding-inline: 22px; }
      .toolbar { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .cover { min-height: 160px; }
    }
    @media (min-width: 930px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <header>
    <h1 class="brand">Nombre Tienda</h1>
    <p>Librería educativa · Aprende, crea y descubre</p>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Buscar libros..." aria-label="Buscar libros">
      <nav class="categories" id="categories" aria-label="Categorías"></nav>
    </div>
    <section>
      <div class="intro">
        <h2>Catálogo de libros</h2>
        <span id="count"></span>
      </div>
      <div class="grid" id="products"></div>
      <div class="empty" id="empty">No encontramos libros con esa búsqueda.</div>
    </section>
  </main>

  <footer>
    ¿Buscas algún libro? <a href="https://wa.me/525632553113" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
    <div style="margin-top:8px">© <span id="year"></span> Nombre Tienda</div>
  </footer>

  <script>
    // EDITA AQUÍ: cambia nombres, descripciones, precios, emojis y categorías.
    // Los precios y títulos son ejemplos provisionales.
    const products = [
      { name: "Matemáticas paso a paso", category: "Matemáticas", description: "Ejercicios de sumas, restas, multiplicaciones y divisiones para primaria.", price: 95, emoji: "➗" },
      { name: "Retos de cálculo mental", category: "Matemáticas", description: "Actividades breves para practicar números y operaciones.", price: 80, emoji: "🔢" },
      { name: "Geometría divertida", category: "Matemáticas", description: "Figuras, medidas, perímetros y actividades visuales.", price: 110, emoji: "📐" },

      { name: "Ortografía para primaria", category: "Español y lectura", description: "Prácticas de acentuación, puntuación y escritura correcta.", price: 90, emoji: "✍️" },
      { name: "Cuentos para leer en voz alta", category: "Español y lectura", description: "Lecturas cortas para mejorar comprensión y fluidez.", price: 105, emoji: "📚" },
      { name: "Comprensión lectora", category: "Español y lectura", description: "Textos y preguntas para desarrollar la comprensión.", price: 120, emoji: "🔎" },

      { name: "Dibujo y color", category: "Arte y creatividad", description: "Ideas para dibujar, colorear y explorar técnicas sencillas.", price: 85, emoji: "🎨" },
      { name: "Manualidades escolares", category: "Arte y creatividad", description: "Proyectos creativos con materiales fáciles de conseguir.", price: 100, emoji: "✂️" },
      { name: "Música para pequeños", category: "Arte y creatividad", description: "Introducción a ritmos, instrumentos y sonidos.", price: 115, emoji: "🎵" },

      { name: "Ciencias naturales ilustradas", category: "Ciencias naturales", description: "Plantas, animales, cuerpo humano y medio ambiente.", price: 130, emoji: "🌱" },
      { name: "Experimentos seguros en casa", category: "Ciencias naturales", description: "Actividades sencillas para observar y aprender ciencia.", price: 125, emoji: "🧪" },
      { name: "El planeta Tierra", category: "Ciencias naturales", description: "Agua, clima, ecosistemas y cuidado del planeta.", price: 105, emoji: "🌎" },

      { name: "Atlas infantil del mundo", category: "Geografía e historia", description: "Mapas, continentes, países y paisajes del mundo.", price: 145, emoji: "🗺️" },
      { name: "Historia de México para niños", category: "Geografía e historia", description: "Un recorrido introductorio por momentos históricos de México.", price: 135, emoji: "🏛️" },
      { name: "Mi comunidad y sus mapas", category: "Geografía e historia", description: "Aprende a ubicar lugares, leer mapas y conocer la comunidad.", price: 90, emoji: "🧭" }
    ];

    const whatsappNumber = "525632553113"; // México: 52 + número, sin espacios ni signos.
    let activeCategory = "Todas";
    const productsEl = document.getElementById("products");
    const categoriesEl = document.getElementById("categories");
    const searchEl = document.getElementById("search");
    const countEl = document.getElementById("count");
    const emptyEl = document.getElementById("empty");

    const categories = ["Todas", ...new Set(products.map(p => p.category))];

    function renderCategories() {
      categoriesEl.innerHTML = "";
      categories.forEach(category => {
        const button = document.createElement("button");
        button.className = "cat-btn" + (activeCategory === category ? " active" : "");
        button.textContent = category;
        button.type = "button";
        button.addEventListener("click", () => {
          activeCategory = category;
          renderCategories();
          renderProducts();
        });
        categoriesEl.appendChild(button);
      });
    }

    function renderProducts() {
      const term = searchEl.value.trim().toLocaleLowerCase("es");
      const filtered = products.filter(p => {
        const matchesCategory = activeCategory === "Todas" || p.category === activeCategory;
        const matchesSearch = `${p.name} ${p.category} ${p.description}`.toLocaleLowerCase("es").includes(term);
        return matchesCategory && matchesSearch;
      });
      productsEl.innerHTML = "";
      filtered.forEach(p => {
        const message = `Hola, me interesa el libro "${p.name}" de la categoría ${p.category}. ¿Está disponible?`;
        const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="cover" aria-hidden="true">${p.emoji}<span>${p.category}</span></div>
          <div class="card-body">
            <div class="category">${p.category}</div>
            <h3></h3>
            <p class="description"></p>
            <div class="price"></div>
            <a class="buy" target="_blank" rel="noopener" href="${url}">Pedir por WhatsApp</a>
          </div>`;
        card.querySelector("h3").textContent = p.name;
        card.querySelector(".description").textContent = p.description;
        card.querySelector(".price").textContent = `$${Number(p.price).toFixed(2)} MXN`;
        productsEl.appendChild(card);
      });
      countEl.textContent = `${filtered.length} ${filtered.length === 1 ? "libro" : "libros"}`;
      emptyEl.style.display = filtered.length ? "none" : "block";
    }

    searchEl.addEventListener("input", renderProducts);
    document.getElementById("year").textContent = new Date().getFullYear();
    renderCategories();
    renderProducts();
  </script>
</body>
</html>
